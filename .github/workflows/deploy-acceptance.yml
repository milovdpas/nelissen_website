name: Deploy to Vercel (acceptance)

on:
  push:
    branches:
      - acceptance # Acceptance/staging environment on Vercel

# One acceptance deploy at a time.
concurrency:
  group: deploy-vercel-acceptance
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Pull project settings + environment variables from Vercel.
      # SMTP_*, CONTACT_* and NEXT_PUBLIC_SITE_URL live in the Vercel project's
      # Environment Variables (dashboard), not in this repo.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
