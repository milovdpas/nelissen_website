name: Deploy acceptance to VPS

on:
  push:
    branches:
      - acceptance
  workflow_dispatch:

# Separate group from the production deploy on purpose: a shared group would make
# an acceptance push cancel an in-flight production deploy, and vice versa.
concurrency:
  group: deploy-vps-acceptance
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_DIR: /opt/apps/nelissen-website-acceptance
  IMAGE: nelissen-website

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Three deliberate differences from the production build:
      #
      #   NEXT_PUBLIC_SITE_URL  the acceptance host, so canonicals, sitemap and
      #                         OG tags self-reference this environment instead
      #                         of pointing visitors at production.
      #   NEXT_PUBLIC_GA_ID     omitted. Every click while testing would
      #                         otherwise land in the live Analytics property and
      #                         quietly corrupt the numbers. Analytics.tsx
      #                         renders nothing when the id is absent.
      #   APP_ENV               acceptance — blocks indexing and diverts all
      #                         outgoing mail to the test inbox.
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://acceptance.tegelhandelnelissen.nl
            APP_ENV=acceptance
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nelissen-website:acceptance
            ${{ secrets.DOCKERHUB_USERNAME }}/nelissen-website:acceptance-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      # Same host-key pinning as the production deploy — see deploy.yml for how
      # to generate VPS_KNOWN_HOSTS.
      - name: Pin VPS host key
        env:
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            echo "SSH_OPTS=-o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"
          else
            echo "::warning title=Unpinned host key::VPS_KNOWN_HOSTS is not set; falling back to StrictHostKeyChecking=accept-new (trust on first use)."
            echo "SSH_OPTS=-o StrictHostKeyChecking=accept-new" >> "$GITHUB_ENV"
          fi

      # Secrets go through the environment rather than `${{ }}` interpolation in
      # the script body — see the note in deploy.yml.
      #
      # CONTACT_TO is deliberately NOT written here: with APP_ENV=acceptance the
      # mailer ignores it and sends everything to CONTACT_TO_TEST instead, so the
      # real inbox address never reaches this machine at all.
      - name: Transfer deployment files to VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_TO_TEST: ${{ secrets.CONTACT_TO_TEST }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
        run: |
          trap 'rm -f deploy.env' EXIT
          umask 077

          ssh $SSH_OPTS "$USER@$HOST" "mkdir -p $APP_DIR"

          {
            printf 'DOCKERHUB_USERNAME=%s\n' "$DOCKERHUB_USERNAME"
            printf 'APP_ENV=acceptance\n'
            printf 'SMTP_HOST=%s\n'       "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n'       "$SMTP_PORT"
            printf 'SMTP_SECURE=%s\n'     "$SMTP_SECURE"
            printf 'SMTP_USER=%s\n'       "$SMTP_USER"
            printf 'SMTP_PASS=%s\n'       "$SMTP_PASS"
            printf 'CONTACT_TO_TEST=%s\n' "$CONTACT_TO_TEST"
            printf 'CONTACT_FROM=%s\n'    "$CONTACT_FROM"
          } > deploy.env

          rsync -avz -e "ssh $SSH_OPTS" \
            docker-compose.acceptance.yml "$USER@$HOST:$APP_DIR/docker-compose.yml"
          rsync -avz --chmod=F600 -e "ssh $SSH_OPTS" \
            deploy.env "$USER@$HOST:$APP_DIR/.env"

      - name: Deploy with Docker Compose
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh $SSH_OPTS "$USER@$HOST" \
            "cd $APP_DIR && docker compose pull && docker compose up -d && docker compose ps"
