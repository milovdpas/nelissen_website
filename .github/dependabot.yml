# Managed alongside the weekly audit in milovdpas/vps_hosting (doc 07).
# Dependabot opens the fix PRs; the audit only reports what is still open.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch noise; majors stay separate so a
      # breaking bump is never hidden inside a batch.
      routine:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node has to track the Node major in the Dockerfile, not the
      # newest release. Dependabot proposed 26 against a Node 22 runtime, which
      # types APIs that are not there at run time. Bump this by hand, with the
      # base image.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ESLint 10 and TypeScript 7 both break `npm run lint`, for the same
      # underlying reason: eslint-config-next bundles its own plugins, and those
      # still call an ESLint 9 API that 10 removed ("contextOrFilename
      # .getFilename is not a function"), while typescript-eslint refuses TS 7
      # outright ("typescript-eslint does not support TS 7.0"). Both verified
      # 2026-09-24. Drop these two entries once eslint-config-next ships support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Node majors alternate LTS (even) and Current (odd), and Dependabot reads
      # only the tag number — it proposed 25-alpine, which had already been EOL
      # since 2026-06-01. Choose LTS majors by hand and bump @types/node with
      # them.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Keeps actions/checkout, setup-node etc. patched.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
