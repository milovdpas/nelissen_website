# Deployed to /opt/apps/nelissen-website/docker-compose.yml by .github/workflows/deploy.yml.
# The nginx "proxy" container reaches this app by container_name over the shared
# "web" network; nothing here publishes a host port.
services:
  app:
    image: ${DOCKERHUB_USERNAME}/nelissen-website:latest
    container_name: nelissen-website
    restart: unless-stopped
    # SMTP_* / CONTACT_* are runtime config, written by the deploy workflow.
    env_file:
      - .env
    expose:
      - "80"
    # The image runs as an unprivileged user (uid 1001). This namespaced sysctl
    # lets that user bind :80 inside the container, so the port stays the same
    # for the proxy while the server no longer runs as root.
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    # A Node server that only listens on a socket needs no Linux capabilities and
    # must never gain privileges through setuid binaries.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
    external: true
